<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="card-size" content="1500x500"><title>X banner: wordmark</title>
<!--COMMON-->
<style>
body { width: 1500px; height: 500px; background: var(--accent); color: var(--accentInk); }
.headline { position: absolute; left: 64px; top: 64px; width: 1130px; margin: 0; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 100px; line-height: .98; letter-spacing: -.03em; }
.sub { position: absolute; left: 450px; top: 330px; margin: 0; font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 44px; line-height: 1.1; letter-spacing: -.01em; }
.mark { position: absolute; right: 64px; top: 64px; width: 200px; height: 200px; border-radius: 50%; border: 4px solid var(--accentInk); }
.mark img { width: 100%; height: 100%; border-radius: 50%; display: block; }
</style></head>
<body data-theme="{{theme}}">
<h1 class="headline">{{headline}}</h1>
<p class="sub">{{subline}}</p>
<div class="mark"><img src="{{assets}}/avatar.png" alt=""></div>
</body></html>
