<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="card-size" content="1200x675"><title>Terminal card</title>
<!--COMMON-->
<style>
body { width: 1200px; height: 675px; }
.card { width: 100%; height: 100%; padding: 44px 64px 48px; display: flex; flex-direction: column; gap: 22px; }
.top { display: flex; justify-content: space-between; align-items: center; }
h1 { margin: 0; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 56px; line-height: 1.05; letter-spacing: -.02em; }
.term { flex: 1; background: var(--term); color: var(--termFg); border-radius: 14px; border: 2px solid var(--line); box-shadow: 6px 6px 0 var(--shade); padding: 22px 30px 22px; font-family: "JetBrains Mono", Consolas, monospace; font-weight: 500; font-size: 22px; line-height: 1.5; position: relative; overflow: hidden; }
.dots { display: flex; gap: 8px; margin-bottom: 14px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--termMute); opacity: .55; }
.cmd { margin: 0 0 6px; }
.cmd b { color: var(--termMute); font-weight: 700; }
.row { white-space: pre-wrap; overflow-wrap: anywhere; }
.row.hot { color: var(--accent); font-weight: 700; }
</style></head>
<body data-theme="{{theme}}">
<div class="card">
  <div class="top"><div class="brand"><img src="{{assets}}/avatar-1024.png" alt=""><span>Ignore Previous</span></div><div class="url">{{url}}</div></div>
  <h1>{{headline}}</h1>
  <div class="term">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="cmd"><b>&gt;</b> {{command}}</div>
    {{{rows_html}}}
  </div>
</div>
</body></html>
