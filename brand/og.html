<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><title>Link preview</title>
<style>
@font-face { font-family: "Bricolage Grotesque"; font-weight: 500 800; font-stretch: 100%; src: url(../src/assets/fonts/bricolage-grotesque-latin.woff2) format("woff2"); }
@font-face { font-family: "Figtree"; font-weight: 400 600; src: url(../src/assets/fonts/figtree-latin.woff2) format("woff2"); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #ffcf1f; color: #14161c; -webkit-font-smoothing: antialiased; }
.shog { position: absolute; left: 50px; top: 55px; width: 520px; height: 520px; }
.text { position: absolute; left: 610px; top: 0; bottom: 0; width: 540px; display: flex; flex-direction: column; justify-content: center; }
h1 { margin: 0; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 100px; line-height: .95; letter-spacing: -.03em; }
.sub { margin: 18px 0 0; font-family: "Figtree", sans-serif; font-weight: 600; font-size: 29px; line-height: 1.2; }
.rule { width: 150px; height: 8px; margin: 30px 0 30px; background: #14161c; }
.tag { margin: 0; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 50px; line-height: 1.08; letter-spacing: -.015em; }
.url { margin: 32px 0 0; font-family: "Figtree", sans-serif; font-weight: 600; font-size: 28px; }
</style></head>
<body>
<img class="shog" src="shoggoth-primary-brand-1024.png" alt="">
<div class="text">
  <h1>Ignore<br>Previous</h1>
  <p class="sub">Tools and guides for people who use AI.</p>
  <div class="rule"></div>
  <p class="tag">Seems fine?<br>Check properly.</p>
  <p class="url">ignoreprevious.dev</p>
</div>
</body></html>
